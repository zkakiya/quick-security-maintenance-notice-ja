<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一時閉鎖のお知らせ</title>
    <style>
        :root {
            --main-color: #333;/*文字色*/
            --background-color: #f9f9f9;/*背景色*/
            font-size: 16px;/*基本の文字サイズ*/
        }
        * {
            /*ブラウザのデフォルトスタイルをリセット*/
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {   
            align-items: center;    
            display: flex;
            justify-content: center;
            min-height: 100%;
        }
        body {
            background-color: var(--background-color);
            color: var(--main-color);
        }
        .wrapper {
            max-width: 50rem;
            margin: 4rem auto;
            padding: 1.25rem;
            text-align: left;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
    
<div class="wrapper">
    <h1>一時閉鎖のお知らせ</h1>
    <p>脆弱性対策のため一旦閉鎖します。</p>
</div>

</body>
</html>
